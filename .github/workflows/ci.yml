name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun.lock is committed — frozen install keeps CI reproducible and
      # identical to local dev (the project's package manager is bun).
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      # Biome owns formatting + extra lint rules; keep it green.
      - name: Lint & format (Biome)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Build needs no secrets: DB access is lazy (lib/db/client.ts) and the
      # wagmi config has a fallback projectId.
      - name: Build
        run: bun run build

      # Fail if lib/db/schema.ts has drifted from the committed Drizzle migrations.
      - name: Check Drizzle schema is in sync
        run: |
          bunx drizzle-kit generate --name=ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::lib/db/schema.ts drifted from committed migrations. Run 'bun run db:generate' and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
          echo "Drizzle schema is in sync."
